# Build and publish the Mail Catcher image to GitHub Container Registry.
# Runs on every push to main (tagged :latest + :sha-<commit>) and on version
# tags like v1.2.0 (tagged :1.2.0). Multi-arch: amd64 + arm64.
#
# The image is booted and health-checked before anything is pushed. That step
# exists because a native dependency can be linked against a newer glibc than
# the base image provides: the build succeeds, the layers publish, and the
# container then dies on its first database call. Testing the built image is
# the only thing that catches it — running the standalone output on the runner
# does not, because the runner has its own, newer glibc.

name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # Single-arch build loaded into the local daemon so it can actually be run.
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mailcatcher:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the image and check it works
        run: |
          set -euo pipefail

          # Plaintext on purpose: the entrypoint hashing it is the documented
          # path, so this covers argon2 loading in the runtime image too.
          docker run -d --name mc-ci -p 3000:3000 -v mc-ci-data:/data \
            -e APP_SECRET=ci-image-test-secret \
            -e ADMIN_PASSWORD=ci-test-password \
            mailcatcher:ci

          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            sleep 2
          done

          echo "--- container logs ---"
          docker logs mc-ci

          echo "The entrypoint must have hashed the plaintext password:"
          docker logs mc-ci 2>&1 | grep -q 'Hashed ADMIN_PASSWORD'

          echo "Container must still be running (a native-module crash shows up here):"
          test "$(docker inspect -f '{{.State.Running}}' mc-ci)" = "true"

          echo "Health endpoint:"
          curl -fsS http://127.0.0.1:3000/api/health

          echo "Dashboard must redirect an anonymous visitor:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = "307"

          echo "Login page must render:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/login)" = "200"

          echo "Migrations must have created the database on the volume:"
          docker exec mc-ci test -f /data/mailcatcher.db

          echo "Ingest must accept a submission and store the contact:"
          docker exec mc-ci node -e "
            const D = require('better-sqlite3');
            const d = new D('/data/mailcatcher.db');
            d.prepare('insert into forms (id,name,slug,status,fields,settings,created_at,updated_at) values (?,?,?,?,?,?,?,?)').run(
              'citestform','CI test','ci-test','active',
              JSON.stringify([{key:'email',label:'Email',type:'email',required:true}]),
              JSON.stringify({redirectUrl:null,successMessage:'Thanks!',themeColor:'#4f46e5',honeypotName:'company_website',allowedOrigins:[]}),
              Date.now(), Date.now());
          "
          curl -fsS -X POST http://127.0.0.1:3000/f/citestform \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com"}' | grep -q '"ok":true'

          docker exec mc-ci node -e "
            const D = require('better-sqlite3');
            const n = new D('/data/mailcatcher.db')
              .prepare(\"select count(*) c from contacts where email = 'ci@example.com'\").get().c;
            if (n !== 1) { console.error('contact was not stored'); process.exit(1); }
            console.log('Contact stored.');
          "

          echo "A plain form POST must redirect to the public host, not the container's own address:"
          location=$(curl -s -o /dev/null -D - -X POST http://127.0.0.1:3000/f/citestform \
            -H 'X-Forwarded-Host: forms.example.com' \
            -H 'X-Forwarded-Proto: https' \
            -d 'email=ci-redirect@example.com' | grep -i '^location:' | tr -d '\r')
          echo "  $location"
          case "$location" in
            *https://forms.example.com/form/citestform/thanks*) ;;
            *) echo "wrong redirect target"; exit 1 ;;
          esac

          docker rm -f mc-ci >/dev/null

      # Only now publish, multi-arch. The layers are already cached above.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
